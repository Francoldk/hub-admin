<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel · De China al Mundo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    /* LOGO + TITULO */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .header img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border-radius: 12px;
      background: #0f172a;
      padding: 6px;
    }
    .header-text h1 {
      font-size: 24px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-text .sub {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 2px;
    }

    /* LOGIN */
    #loginView input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: border .2s;
    }
    #loginView input:focus { border-color: #38bdf8; }

    #loginView button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      border: none;
      border-radius: 10px;
      color: #0f172a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: opacity .2s;
    }
    #loginView button:hover { opacity: .9; }

    .error {
      color: #f87171;
      font-size: 13px;
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* SOLAPAS */
    .tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .tab {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px 20px;
      text-decoration: none;
      color: #e2e8f0;
      transition: all .2s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tab:hover {
      border-color: #38bdf8;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(56,189,248,.15);
    }
    .tab .icon { font-size: 28px; }
    .tab .name { font-weight: 600; font-size: 16px; }
    .tab .desc { font-size: 12px; color: #64748b; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="/logo.png" alt="De China al Mundo" />
      <div class="header-text">
        <h1>De China al Mundo</h1>
        <p class="sub">Panel de administración</p>
      </div>
    </div>

    <!-- LOGIN -->
    <div id="loginView">
      <div class="error" id="errorMsg"></div>
      <input type="text" id="user" placeholder="Usuario" autocomplete="username" />
      <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password" />
      <button onclick="doLogin()">Ingresar</button>
    </div>

    <!-- SOLAPAS -->
    <div id="panelView" class="hidden">
      <div class="tabs">
  <a class="tab" href="https://etiquetas.dechinaalmundo.com.ar/">
    <span class="icon">🏷️</span>
    <span class="name">Etiquetas</span>
    <span class="desc">Generador de códigos de barras</span>
  </a>
  <a class="tab" href="https://cotizador.dechinaalmundo.com.ar/">
    <span class="icon">🧮</span>
    <span class="name">Cotizador</span>
    <span class="desc">Cotizaciones de comercio exterior</span>
  </a>
  <a class="tab" href="https://crm.dechinaalmundo.com.ar/">
    <span class="icon">👥</span>
    <span class="name">CRM</span>
    <span class="desc">Gestión de clientes</span>
  </a>
  <a class="tab" href="https://dashboard.dechinaalmundo.com.ar/">
    <span class="icon">📊</span>
    <span class="name">Dashboard</span>
    <span class="desc">Métricas y reportes</span>
  </a>
  <a class="tab" href="https://whatsmasivo.dechinaalmundo.com.ar/">
    <span class="icon">💬</span>
    <span class="name">Whats Masivo</span>
    <span class="desc">Envío masivo de WhatsApp</span>
  </a>
</div>
    </div>
  </div>

  <script>
    // Si ya hay cookie, mostramos panel directo
    if (document.cookie.includes("hub_auth=")) {
      showPanel();
    }

    async function doLogin() {
      const user = document.getElementById("user").value.trim();
      const password = document.getElementById("pass").value;
      const err = document.getElementById("errorMsg");
      err.textContent = "";

      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user, password })
        });
        if (r.ok) {
          showPanel();
        } else {
          err.textContent = "Usuario o contraseña incorrectos";
        }
      } catch (e) {
        err.textContent = "Error de conexión";
      }
    }

    function showPanel() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("panelView").classList.remove("hidden");
    }

    // Enter para loguear
    document.getElementById("pass").addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
